name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.preset }} / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, release]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx: g++-13
          - compiler: clang
            cxx: clang++-18
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Ubuntu 24.04 runners use 32 bits of mmap ASLR entropy, which breaks
      # the sanitizers' fixed shadow-memory layout. 28 bits is the old default.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset != 'release'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
